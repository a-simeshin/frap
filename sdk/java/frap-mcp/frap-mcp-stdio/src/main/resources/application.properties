# stdout is reserved for the MCP stdio JSON-RPC protocol.
# Anything written to stdout (banner, console logs) corrupts the handshake.
spring.main.web-application-type=none
spring.main.banner-mode=off

# MCP server identity / transport
spring.ai.mcp.server.name=frap-mcp-stdio
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true

# I/O mode: stdio = file-mode. Server and agent share the local filesystem, so
# large artefacts (DOM snapshot, ElementMap, generated Page Object) are passed
# by absolute path + a compact digest instead of inline JSON — keeps them out of
# the agent context. Activates FrapFileTools via @ConditionalOnProperty.
frap.io.mode=file

# Working directory for file-mode artefacts (read/written ElementMaps, generated
# files). Absolute paths are returned to the agent; nothing is auto-deleted.
# Defaults to ${java.io.tmpdir}/frap when unset. Uncomment to override:
#frap.io.work-dir=${java.io.tmpdir}/frap

# Logging: file only. stdout is reserved for the MCP protocol stream, so the
# console appender is disabled entirely (threshold OFF) rather than blanked with an
# empty pattern (an empty pattern makes logback log "Empty or null pattern").
logging.file.name=frap-mcp.log
logging.threshold.console=OFF
