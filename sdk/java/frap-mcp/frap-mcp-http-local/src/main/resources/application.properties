# Streamable-HTTP transport + file mode: a normal web server (stdout is free here,
# unlike the stdio runner) that, like stdio, exchanges artefacts as local file
# paths instead of inline JSON. This requires a filesystem shared with the client.
# Distinct default port 8765 (vs the inline http runner's 8080) so both can run
# side by side; override with --server.port.

# MCP server identity / transport.
# protocol=STREAMABLE selects the streamable-http transport provided by
# spring-ai-starter-mcp-server-webmvc (Spring MVC). The tools are the same
# transport-neutral @McpTool methods scanned from io.github.kotlerdev.frap.mcp.tools.
spring.ai.mcp.server.name=frap-mcp-http-local
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=frap MCP server (streamable-http, FILE mode). Tools exchange local file paths, not inline JSON. Requires shared filesystem with the client.

# Streamable-http endpoint. Single endpoint handling all JSON-RPC traffic
# (initialize / tools/list / tools/call) via HTTP POST; the same path streams
# server-to-client notifications. Default is /mcp; set explicitly for clarity
# and so the README can document a stable path.
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.streamable-http.keep-alive-interval=30s

# Distinct default port (8765) so this file-mode http runner can coexist with
# the inline http runner (8080). Override at launch with --server.port.
server.port=8765

# I/O mode: file = server and client share the local filesystem, so large
# artefacts (DOM snapshot, ElementMap, generated Page Object) are passed by
# absolute path + a compact digest instead of inline JSON — keeps them out of
# the agent context. Activates FrapFileTools via @ConditionalOnProperty.
frap.io.mode=file

# Working directory for file-mode artefacts (read/written ElementMaps, generated
# files). Absolute paths are returned to the client; nothing is auto-deleted.
# Defaults to ${java.io.tmpdir}/frap when unset. Uncomment to override:
#frap.io.work-dir=${java.io.tmpdir}/frap

# Snapshot ingest endpoint URL. The SnapshotIngestController serves POST /frap/ingest:
# a browser page context (playwright/chrome-devtools-mcp) cannot write local files, so
# the page POSTs its raw DOM snapshot here and the server saves it to work-dir, keeping
# the large snapshot out of the agent context. This URL is baked into the snapshot script
# (FrapSnapshotTool) so the page knows where to POST. ${server.port} tracks --server.port.
frap.io.ingest-url=http://127.0.0.1:${server.port}/frap/ingest

spring.main.banner-mode=off
